name: Documentation
description: Report missing or incorrect documentation
title: "[Docs]: "
labels: ["documentation"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Help us improve our documentation.

  - type: dropdown
    id: type
    attributes:
      label: Documentation Type
      options:
        - Missing documentation
        - Incorrect or outdated documentation
        - Unclear documentation
        - New documentation needed
    validations:
      required: true

  - type: textarea
    id: location
    attributes:
      label: Location
      description: Where is the documentation issue? (URL, file path, section)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be changed or added?
    validations:
      required: true

  - type: textarea
    id: suggested
    attributes:
      label: Suggested Content
      description: If you can, provide the corrected or new content.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I can submit a PR to fix this documentation
