name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe what you'd like.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: I'm frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the desired feature or enhancement.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered?

  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      options:
        - Work Orders
        - Inventory
        - Financial
        - Burials
        - Contracts
        - Grants
        - Authentication
        - Dashboard
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Suggested Priority
      options:
        - P0 (Critical path, blocks work)
        - P1 (Important, needed soon)
        - P2 (Nice to have)
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: Design / Mockup
      description: Add Figma links, sketches, or screenshots if available.

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context about the feature request.
