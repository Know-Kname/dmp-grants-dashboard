name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Type-Check & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # Read the Node version from .nvmrc (22) so CI matches package.json
          # `engines` and the Vercel build. A green run has to be on the version
          # that actually ships, or it proves nothing.
          #
          # 22 and not 24, though Vercel's build image offers both: 22 is what
          # the development containers run, so local verification and CI agree
          # byte for byte. 24 is the newer LTS and the obvious next step once
          # nothing riskier is in flight — it is a one-line change here.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit --pretty

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:run

  smoke:
    name: Browser Smoke
    runs-on: ubuntu-latest

    # Separate job, not another step: it needs a browser download, so keeping it
    # off the critical path means the fast feedback of lint/type-check/test is
    # not held up behind it.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Chromium only. These tests check that the application runs, not that it
      # renders identically everywhere, so the other engines would buy nothing
      # for triple the install time.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds and serves the production bundle itself — see playwright.config.ts.
      - name: Smoke tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
