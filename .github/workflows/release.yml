name: Auto Tag and Release

on:
  push:
    branches: [main]
    # Gate on shipped code only. Without this the workflow patch-bumps the
    # version on every push to main, including docs-only and CI-only commits,
    # producing a stream of releases with no product change in them.
    paths:
      - 'src/**'
      - 'api/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'vercel.json'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - 'tsconfig*.json'
      - 'supabase/migrations/**'
  workflow_dispatch:
    # Manual trigger for cutting a release that the path filter would skip.

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: '0'

      - name: Bump version and push tag
        # Re-pinned. The previous SHA (a29250a...) does not exist in
        # anothrNick/github-tag-action — verified by
        # `git fetch https://github.com/anothrNick/github-tag-action <sha>`,
        # which cannot resolve it. That is why all 18 runs of this workflow
        # failed with "Unable to resolve action" and the repo has never
        # produced a git tag or a GitHub Release. The SHA below is the commit
        # that refs/tags/v1 and refs/tags/1.75.0 both point at, confirmed via
        # `git ls-remote --tags` plus a successful `git fetch` of the object.
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8  # v1 (1.75.0)
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          RELEASE_BRANCHES: main
          DEFAULT_BUMP: patch

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191  # v2
        with:
          tag_name: ${{ steps.bump.outputs.new_tag }}
          name: "Release ${{ steps.bump.outputs.new_tag }}"
          generate_release_notes: true
          make_latest: true
