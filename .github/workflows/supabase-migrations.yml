name: Deploy Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/seed.sql'
  workflow_dispatch:
    # Manual trigger: Actions → Deploy Supabase Migrations → Run workflow.
    # Use this to deploy on a schedule you control, or to re-run after a
    # failed auto-deploy without needing a new commit.

jobs:
  deploy-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@78e2f5c76c9df4afd4b7ed5cac1c5b2b0b8e7c71  # v1
        with:
          version: latest

      - name: Link to production project
        run: |
          supabase link \
            --project-ref "${{ secrets.PRODUCTION_PROJECT_REF }}" \
            --password "${{ secrets.PRODUCTION_DB_PASSWORD }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify migration state pre-push
        run: supabase migration list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy migrations to production
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify migration state post-push
        run: supabase migration list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
