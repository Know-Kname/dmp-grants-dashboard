name: Deploy Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/seed.sql'
  workflow_dispatch:
    # Manual trigger: Actions → Deploy Supabase Migrations → Run workflow.
    # Use this to deploy on a schedule you control, or to re-run after a
    # failed auto-deploy without needing a new commit.

jobs:
  deploy-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Supabase CLI
        # Pinned to the v1 tag rather than a commit SHA, unlike the checkout step
        # above. The SHA that was here (78e2f5c...) does not correspond to any
        # commit in supabase/setup-cli — "Unable to resolve action" on the very
        # first step, before checkout even runs. That means this workflow has
        # failed on every run in its history (confirmed: runs #1, #2, and the
        # run triggered by merging #83 all fail identically). This session
        # could not independently verify a replacement SHA against a second
        # source (GitHub API access is scoped to this repo only), so it uses the
        # tag the original comment already named rather than guess a new SHA
        # that might be equally wrong. Re-pin to a verified commit SHA when
        # someone can confirm one against supabase/setup-cli's actual releases.
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to production project
        run: |
          supabase link \
            --project-ref "${{ secrets.PRODUCTION_PROJECT_REF }}" \
            --password "${{ secrets.PRODUCTION_DB_PASSWORD }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify migration state pre-push
        run: supabase migration list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy migrations to production
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify migration state post-push
        run: supabase migration list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
