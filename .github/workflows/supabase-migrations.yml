name: Deploy Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/seed.sql'
  workflow_dispatch:
    # Manual trigger: Actions → Deploy Supabase Migrations → Run workflow.
    # Use this to deploy on a schedule you control, or to re-run after a
    # failed auto-deploy without needing a new commit.

jobs:
  deploy-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup Supabase CLI
        # Pinned to the v1 branch ref rather than a commit SHA, unlike the
        # checkout step above. The bad SHA that used to be here was replaced in
        # daee2ef; this pin resolves and is no longer the reason this workflow
        # fails.
        #
        # REQUIRED REPOSITORY SECRETS (Settings -> Secrets and variables ->
        # Actions). Until all three exist this workflow cannot deploy anything;
        # the guard step below fails fast and names the missing ones:
        #   SUPABASE_ACCESS_TOKEN  — personal access token from
        #                            https://supabase.com/dashboard/account/tokens
        #   PRODUCTION_PROJECT_REF — mgpwjnxtqcnoyjgebytg
        #   PRODUCTION_DB_PASSWORD — the project's Postgres password
        # Full setup instructions: docs/13-ci-and-database-operations.md
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Fail with an actionable message rather than letting the Supabase CLI
      # report a confusing login/link error when a secret is simply unset. With
      # all three secrets empty the link step ran as
      # `supabase link --project-ref "" --password ""`, which fails in a way
      # that looks like an auth problem rather than a configuration gap.
      - name: Verify required secrets are configured
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PRODUCTION_PROJECT_REF: ${{ secrets.PRODUCTION_PROJECT_REF }}
          PRODUCTION_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ]  || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$PRODUCTION_PROJECT_REF" ] || missing="$missing PRODUCTION_PROJECT_REF"
          [ -n "$PRODUCTION_DB_PASSWORD" ] || missing="$missing PRODUCTION_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            echo "See docs/13-ci-and-database-operations.md for exact values and steps."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Link to production project
        run: |
          supabase link \
            --project-ref "${{ secrets.PRODUCTION_PROJECT_REF }}" \
            --password "${{ secrets.PRODUCTION_DB_PASSWORD }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify migration state pre-push
        run: supabase migration list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy migrations to production
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify migration state post-push
        run: supabase migration list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
