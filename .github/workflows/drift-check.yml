name: Weekly Drift Check

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 09:00 UTC
  workflow_dispatch:       # Manual trigger from Actions tab

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@78e2f5c76c9df4afd4b7ed5cac1c5b2b0b8e7c71  # v1
        with:
          version: latest

      - name: Link to production project
        run: |
          supabase link --project-ref ${{ secrets.PRODUCTION_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Check migration sync state
        id: drift
        run: |
          supabase migration list 2>&1 | tee migration_status.txt
          if grep -qE "^\s*│\s+[0-9]+.*│\s*$" migration_status.txt; then
            echo "DRIFT_DETECTED=true" >> $GITHUB_ENV
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Open GitHub Issue on drift detection
        if: env.DRIFT_DETECTED == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const status = fs.readFileSync('migration_status.txt', 'utf8');
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ [AUTO] Supabase Migration Drift — ' + new Date().toISOString().split('T')[0],
              body: [
                '## Database Drift Detected',
                '',
                'The weekly automated drift check found that local migration files',
                'and the remote production database schema are out of sync.',
                '',
                '### Migration Status',
                '```',
                status,
                '```',
                '',
                '### Remediation Steps',
                '1. `supabase link --project-ref YOUR_REF`',
                '2. `supabase migration list` — identify the discrepancy',
                '3. If remote has changes not in local: `supabase db pull`',
                '4. Commit the new migration file with header comment',
                '5. Push: `supabase db push`',
                '6. Verify: `supabase migration list`',
                '7. Close this issue with a comment describing what was found'
              ].join('\n'),
              labels: ['database', 'urgent', 'automated-alert']
            });
